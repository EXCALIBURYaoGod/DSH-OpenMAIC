# OpenTeach 的 dsh bundle patch：向 profile 的 layer 栈插入 **一个** 可安装行。
#
# 该行指向本包（`@openteach/bundle`）。11 个后端模块插件（llm → db → kernel →
# storage → generation → layout → slide → audio → classroom → openmaic-core → http）
# 不再各自作为 layer 行出现，而是由本包 `src/index.ts` 的 `apply()` 在进程内按依赖
# 顺序组装：
# 这样安装单位是「一个包」，与 dsh-openmaic 的单行 patch 形态一致。
#
# `listen: true` 让插件在被 dsh 装载后自行监听 HTTP 端口（仅提供 API；前端为独立包
# `OpenTeach-frontend`，由其 Next.js 服务通过 OPENTEACH_API_BASE 反向代理到本后端），
# 无需外部宿主代为 app.listen；端口可用 OPENTEACH_PORT 覆盖。
#
# `envPath` / `llmConfigPath` 指向本地凭据与 provider 配置（相对路径按**本包根目录**
# 解析，绝对路径原样使用，与进程工作目录无关）。
# 在 dsh 宿主内运行时，LLM 配置**完全沿用 dsh**：`@openteach/plugin-llm` 反向适配宿主
# 的 `ctx.llm`（provider 路由、端点、模型目录与凭据全部由 dsh 掌管），此处两个路径仅在
# 本包独立运行（无 dsh 内核）时生效，此时按 `llm.config.json` → 内置 DeepSeek 默认解析，
# 凭据始终缺失则 llm 插件降级为 mock。可用 `OPENTEACH_ENV_PATH` / `OPENTEACH_LLM_CONFIG`
# 指向绝对路径（未显式配置 envPath / llmConfigPath 时生效）。
#
# 本文件是 **bundle 层**的 patch（`package.json` 的 `dsh.bundle.patch`）。若希望以
# **用户层插件**注册（不进入 profile 的 `dsh.profile.bundles`），把下面的 insert 行
# 原样写入 `$DSH_HOME/profiles/<name>/cordis.patch.yml` 即可。
- insert:
    - id: openteach
      name: '@openteach/bundle'
      config:
        listen: true
        envPath: ./.env.local
        llmConfigPath: ./llm.config.json